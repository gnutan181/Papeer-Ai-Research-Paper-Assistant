[project]
name = "papeer-ai-research-paper-assistant"
version = "0.1.0"
description = "An anonymous research-paper assistant built with Streamlit and Groq."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "arxiv>=4.0.1",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.1.10",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.2",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=5.7.0",
    "streamlit>=1.61.1",
    "tavily-python>=0.7.27",
    "torchvision>=0.29.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.11.0",
]
evaluation = [
    "deepeval>=2.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
